services:
  - type: web
    name: bot-whatsapp
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: WPP_TOKEN_DIR
        value: /tmp/wppconnect-tokens
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/.cache/puppeteer
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: whatsapp-sessions
      - key: SUPABASE_SESSION_PATH
        value: wppconnect-tokens.zip
      - key: MCP_AUTH_TOKEN
        sync: false
      - key: LOG_MAX_ENTRIES
        value: 180
      - key: LOG_AUTO_CLEAR_HOURS
        value: 12
      - key: MEMORY_WARN_MB
        value: 420
      - key: MEMORY_RESTART_MB
        value: 500
      - key: QR_REFRESH_MS
        value: 0
      - key: PAIRING_WAIT_MS
        value: 90000
