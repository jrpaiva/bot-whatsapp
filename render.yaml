services:
  - type: web
    name: bot-whatsapp
    env: node
    plan: free
    buildCommand: rm -rf node_modules package-lock.json && npm install
    startCommand: node index.js
    envVars:
      - key: WPP_TOKEN_DIR
        value: /tmp/wppconnect-tokens
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/.cache/puppeteer
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: whatsapp-sessions
      - key: SUPABASE_SESSION_PATH
        value: wppconnect-tokens.zip
      - key: MCP_AUTH_TOKEN
        sync: false
