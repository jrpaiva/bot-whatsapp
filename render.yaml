services:
  - type: web
    name: bot-whatsapp-baileys
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: BAILEYS_AUTH_DIR
        value: /tmp/baileys-auth
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: whatsapp-sessions
      - key: SUPABASE_SESSION_PATH
        value: baileys-auth.zip
      - key: SUPABASE_CONFIG_PATH
        value: bot_config.json
      - key: SUPABASE_PREDEFINIDAS_PATH
        value: predefinidas.json
      - key: MCP_AUTH_TOKEN
        sync: false
      - key: LOG_MAX_ENTRIES
        value: 180
      - key: LOG_AUTO_CLEAR_HOURS
        value: 12
      - key: MEMORY_WARN_MB
        value: 360
      - key: MEMORY_RESTART_MB
        value: 470
      - key: PAIRING_WAIT_MS
        value: 90000
      - key: SESSION_AUTOSAVE_MS
        value: 60000
